<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>

<body>
    <!--Unordered list  -->
    <ul>
        <li>Nairobi</li>
        <li>Kisumu</li>
        <li>Nyandarua</li>
        <li>Nakuru</li>
        <li>Mombasa</li>
    </ul>

    <!-- Ordered list -->
    <ol type="i">
        <li>Nairobi</li>
        <li>Kisumu</li>
        <li>Nyandarua</li>
        <li>Nakuru</li>
        <li>Mombasa</li>
    </ol>


</body>

</html>
