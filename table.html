<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body {
            background: #e7e6e6;
            font-family: 'Carlito', sans-serif;

        }

        table {
            border: 2px solid #070707;
            border-collapse: collapse;
            width: 70%;
            margin: auto;
        }

        th {
            border: 1px solid #070707;
            padding-top: 10px;
            padding-bottom: 8px;
            text-align: left;
            background: gray;
            color: white;
            padding-left: 8px;
        }

        td {
            border: 1px solid #070707;
            padding: 10px;

        }

        .dob {
            color: #0c6931;
        }
    </style>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th>First Name</th>

</html>
